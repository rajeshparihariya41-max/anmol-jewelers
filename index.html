    <style>

          radial-gradient(circle at 50% 0, rgba(232, 243, 239, 0.7), transparent 34rem),

        gap: 16px;
      }
      .brand { display: flex; align-items: center; min-width: 0; }

      .button-icon { width: 15px; height: 15px; flex: 0 0 15px; }

      .banner-copy b { margin-top: 6px; color: var(--primary); font-size: 11px; }
      .category-row { display: flex; flex-wrap: wrap; gap: 8px; padding: 16px 16px 0; }
      .pill {
        min-height: 36px; padding: 0 16px; border: 1px solid var(--border); border-radius: 18px;

      .section-heading p { margin: 5px 0 0; color: var(--muted); font-size: 12px; }
      .section-accent { color: var(--primary); font-size: 13px; font-weight: 650; letter-spacing: 1px; }
      .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; padding: 0 12px; }
      .card {
        position: relative; border: 1px solid var(--border); border-radius: 15px; overflow: hidden;
        background: var(--card); box-shadow: 0 4px 14px rgba(43, 91, 82, .03);
      }
      .image-frame { height: 196px; position: relative; background: var(--mint); display: grid; place-items: center; }

      .old-body { padding: 16px; }
      .field-label { display: block; margin-top: 2px; color: var(--muted); font-size: 10px; font-weight: 750; letter-spacing: 1.1px; }
      .purity-row { display: flex; gap: 8px; padding: 11px 0; overflow-x: auto; }

      }
      .purity.active { border-color: var(--primary); background: var(--primary); color: #fff; }

      .status { margin: 0 18px; color: var(--muted); font-size: 12px; text-align: center; }

        .shop-name { font-size: 16px; }
        .hero-badge { width: 76px; height: 76px; flex-basis: 76px; font-size: 10px; }
      }
